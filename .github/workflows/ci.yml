name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # D-002 / D-014: pinned npm, never @latest.
      - name: Install npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Check toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "12.0.2"
          node -e "const [a,b,c]=process.versions.node.split('.').map(Number); if (a===22 && (b<22 || (b===22 && c<2))) { console.error('Node 22 must be >=22.22.2 (D-002)'); process.exit(1); }"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  browser:
    name: Browsers (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Check toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "12.0.2"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
